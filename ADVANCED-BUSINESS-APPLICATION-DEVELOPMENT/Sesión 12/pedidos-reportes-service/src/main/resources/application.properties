spring.application.name=pedidos-reportes-service

server.port=8083
server.servlet.context-path=/pedidos-reportes-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pedidosdb?serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:spedidos_reportes}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.jdbc.core=DEBUG