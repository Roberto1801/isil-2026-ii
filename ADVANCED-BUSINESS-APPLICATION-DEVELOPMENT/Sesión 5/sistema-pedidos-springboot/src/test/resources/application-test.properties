spring.datasource.url=jdbc:h2:mem:pedidosdb_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=admin
spring.datasource.password=${TEST_DB_PASSWORD:pa4_h2_local_only}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.jdbc.core=INFO
demo.security.operador-password=operador-solo-pruebas-h2
demo.security.consulta-password=consulta-solo-pruebas-h2
demo.security.supervisor-password=${TEST_SUPERVISOR_PASSWORD:Pa4SupervisorLocal2026!}
